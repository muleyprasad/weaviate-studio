<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webview preview harness</title>

    <link href="vendors.css" rel="stylesheet" />
    <link href="{{STYLESHEET}}" rel="stylesheet" />

            --vscode-button-hoverBackground: #0258a8;
            --vscode-button-secondaryBackground: #e5e5e5;

            --vscode-badge-foreground: #3b3b3b;

            --vscode-input-border: #cecece;
            --vscode-dropdown-background: #ffffff;
            --vscode-dropdown-foreground: #3b3b3b;
            --vscode-dropdown-border: #cecece;
            --vscode-focusBorder: #005fb8;
            --vscode-textLink-foreground: #005fb8;
            --vscode-textLink-activeForeground: #005fb8;
            --vscode-errorForeground: #f85149;
            --vscode-editorWarning-foreground: #bf8803;
            --vscode-inputValidation-errorBackground: #f2dede;
            --vscode-inputValidation-errorBorder: #be1100;
            --vscode-debugTokenExpression-number: #098658;
            --vscode-debugTokenExpression-string: #a31515;
            --vscode-charts-green: #388a34;

            --vscode-terminal-ansiGreen: #107c10;
            --vscode-terminal-ansiRed: #cd3131;
            --vscode-textPreformat-foreground: #a31515;
            --vscode-symbolIcon-propertyForeground: #0451a5;
            --vscode-notificationsWarningIcon-foreground: #bf8803;
            --vscode-progressBar-background: #005fb8;
            --vscode-scrollbarSlider-background: rgba(100, 100, 100, 0.4);
            --vscode-scrollbarSlider-hoverBackground: rgba(100, 100, 100, 0.7);
            --vscode-scrollbarSlider-activeBackground: rgba(0, 0, 0, 0.6);
            --vscode-scrollbar-shadow: rgba(0, 0, 0, 0.2);
            --vscode-editor-selectionBackground: #add6ff;
        }

        .theme-dark {
            --vscode-foreground: #cccccc;
            --vscode-descriptionForeground: #9d9d9d;

            --vscode-sideBar-background: #181818;
            --vscode-panel-background: #1f1f1f;
            --vscode-panel-border: #2b2b2b;
            --vscode-button-background: #0078d4;
            --vscode-button-foreground: #ffffff;
            --vscode-button-hoverBackground: #026ec1;
            --vscode-button-secondaryBackground: #313131;
            --vscode-button-secondaryForeground: #cccccc;
            --vscode-button-secondaryHoverBackground: #3c3c3c;
            --vscode-button-border: #ffffff1a;
            --vscode-badge-background: #616161;
            --vscode-badge-foreground: #f8f8f8;
            --vscode-list-hoverBackground: #2a2d2e;
            --vscode-list-activeSelectionBackground: #37373d;

            --vscode-dropdown-border: #3c3c3c;
            --vscode-focusBorder: #0078d4;
            --vscode-textLink-foreground: #4daafc;
            --vscode-textLink-activeForeground: #4daafc;
            --vscode-errorForeground: #f85149;
            --vscode-editorWarning-foreground: #cca700;
            --vscode-inputValidation-errorBackground: #5a1d1d;
            --vscode-inputValidation-errorBorder: #be1100;
            --vscode-debugTokenExpression-number: #b5cea8;
            --vscode-debugTokenExpression-string: #ce9178;
            --vscode-charts-green: #89d185;
            --vscode-editorWidget-background: #202020;
            --vscode-editorWidget-foreground: #cccccc;
            --vscode-editorWidget-border: #454545;
            --vscode-widget-border: #313131;
            --vscode-disabledForeground: #cccccc80;
            --vscode-input-placeholderForeground: #989898;
            --vscode-tab-activeBackground: #1f1f1f;
            --vscode-tab-activeForeground: #ffffff;
            --vscode-terminal-ansiGreen: #23d18b;
            --vscode-terminal-ansiRed: #f14c4c;
            --vscode-textPreformat-foreground: #d7ba7d;
            --vscode-symbolIcon-propertyForeground: #cccccc;
            --vscode-notificationsWarningIcon-foreground: #cca700;
            --vscode-progressBar-background: #0078d4;
            --vscode-scrollbarSlider-background: rgba(121, 121, 121, 0.4);
            --vscode-scrollbarSlider-hoverBackground: rgba(100, 100, 100, 0.7);
            --vscode-scrollbarSlider-activeBackground: rgba(191, 191, 191, 0.4);
            --vscode-scrollbar-shadow: rgba(0, 0, 0, 0.36);
            --vscode-editor-selectionBackground: #264f78;

        body {
            margin: 0;
            background-color: var(--vscode-editor-background);
            color: var(--vscode-foreground);
            font-family: var(--vscode-font-family, -apple-system, "Segoe UI", sans-serif);
        }
    </style>

    <script>
        document.documentElement.className = location.search.includes('dark')
            ? 'theme-dark'
            : 'theme-light';

        // ---------------------------------------------------------------------
        // SAMPLE DATA - edit this block to exercise the states you care about.
        // creationTimeUnix / lastUpdateTimeUnix are MILLISECONDS, not microseconds.
        // ---------------------------------------------------------------------
        const collectionName = '{{COLLECTION}}';

        const objects = [
            {
                uuid: '17c748d8-2849-471e-a22f-17689ec4227f',
                properties: {
                    title: 'Compact mechanical keyboard',
                    content: 'Compact mechanical keyboard with quiet tactile switches',
                    category: 'electronics',
                    price: 129.99,
                },
                vector: [0.7573, 0.8184, 0.127, -0.6811, -0.863],
            },
            {
                uuid: '2f4b9d51-33a7-4b6a-9d15-5c1e8d2b7a10',
                properties: {
                    title: 'Noise cancelling headphones',
                    content: 'Premium noise cancelling wireless headphones with a thirty hour battery life',
                    category: 'electronics',
                    price: 249,
                },
                vector: [-0.2211, 0.5512, 0.7431, 0.112, 0.4432],
            },
            {
                uuid: '8c1d2a63-5b14-4e1a-9c7d-2b6e3f8a4c02',
                properties: {
                    title: 'Ergonomic desk chair',
                    content: 'Mesh office chair with adjustable lumbar support',
                    category: 'furniture',
                    price: 389.5,
                },
                vector: [0.3341, -0.7712, 0.2219, 0.5561, 0.0912],
            },
        ];

        objects.forEach((object, index) => {
            object.class = collectionName;
            object.metadata = {
                creationTimeUnix: Date.now() - (index + 1) * 6 * 60 * 1000,
                lastUpdateTimeUnix: Date.now() - (index + 1) * 60 * 1000,
            };
        });

        const schema = {
            name: collectionName,
            vectorizer: 'text2vec-openai',
            vectorizerConfig: [{ name: 'text2vec-openai', config: { model: 'text-embedding-3-small' } }],
            multiTenancy: { enabled: false },
            properties: [
                { name: 'title', dataType: ['text'] },
                { name: 'content', dataType: ['text'] },
                { name: 'category', dataType: ['text'] },
                { name: 'price', dataType: ['number'] },
            ],
        };

        // The webview reads its collection name from window.initialData.
        window.initialData = {
            collectionName,
            connectionId: 'preview-connection',
            queryProfileEnabled: true,
        };

        // ---------------------------------------------------------------------
        // MOCK EXTENSION HOST
        // Replies use the same message shapes the real extension sends.
        // ---------------------------------------------------------------------
        const send = (message) => window.postMessage(message, '*');
        const distances = [0.0812, 0.2347, 0.4108];

        const asSearchResults = () =>
            objects.map((object, index) => ({
                ...object,
                metadata: {
                    ...object.metadata,
                    distance: distances[index],
                    certainty: 1 - distances[index],
                    score: 1 - distances[index],
                },
            }));

        const reply = (message) => {
            const requestId = message && message.requestId;

            switch (message && message.command) {
                case 'initialize':
                case 'fetchSchema':
                    send({
                        command: 'init',
                        collectionName,
                        schema,
                        serverVersion: '1.36.9',
                        readOnly: false,
                        isMultiTenant: false,
                        requestId,
                    });
                    send({
                        command: 'objectsLoaded',
                        objects,
                        total: objects.length,
                        unfilteredTotal: objects.length,
                        requestId,
                    });
                    break;

                case 'fetchObjects':
                case 'refresh': {
                    // Vector search reuses fetchObjects with a vs- request id and
                    // expects distance/certainty/score in each object's metadata.
                    const isVectorSearch = typeof requestId === 'string' && requestId.startsWith('vs-');
                    send({
                        command: 'objectsLoaded',
                        objects: isVectorSearch ? asSearchResults() : objects,
                        total: objects.length,
                        unfilteredTotal: objects.length,
                        requestId,
                    });
                    break;
                }

                case 'getObjectDetail':
                    send({
                        command: 'objectDetailLoaded',
                        object: objects.find((object) => object.uuid === message.uuid),
                        requestId,
                    });
                    break;

                case 'getTenants':
                    send({ command: 'tenantsLoaded', tenants: [], isMultiTenant: false });
                    break;

                default:
                    // Intentionally ignored: copy, export, delete, etc. need no reply
                    // for a layout/theme review.
                    break;
            }
        };

        window.acquireVsCodeApi = () => ({
            postMessage: reply,
            getState: () => ({}),
            setState: () => {},
        });
    </script>
</head>

<body>
    <div id="root"></div>
    <script defer src="shared-theme.bundle.js"></script>
    <script defer src="vendors.bundle.js"></script>
    <script defer src="{{BUNDLE}}"></script>
</body>

</html>
